# Template: inject values from Secrets Manager; never commit credentials.
provider = "oidc"
oidc_issuer_url = "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0"
oidc_user_id_claim = "oid"
client_id = "${ENTRA_CLIENT_ID}"
client_secret = "${ENTRA_CLIENT_SECRET}"
redirect_url = "https://${APP_DOMAIN}/oauth2/callback"
upstreams = [ "http://127.0.0.1:8501/" ]
http_address = "0.0.0.0:4180"
reverse_proxy = true
email_domains = [ "${ALLOWED_EMAIL_DOMAIN}" ]
set_xauthrequest = true
pass_user_headers = true
pass_access_token = false
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_secret = "${OAUTH2_PROXY_COOKIE_SECRET}"
